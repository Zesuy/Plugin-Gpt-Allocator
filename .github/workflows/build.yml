name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test ./...

  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
          - runner: macos-13
            goos: darwin
            goarch: amd64
            ext: dylib
          - runner: macos-14
            goos: darwin
            goarch: arm64
            ext: dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build native plugin
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -buildmode=c-shared -trimpath -o "dist/cpa-route-allocator.${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-route-allocator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/cpa-route-allocator.${{ matrix.ext }}
