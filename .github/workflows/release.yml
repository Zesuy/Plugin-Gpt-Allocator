name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          version="$RELEASE_INPUT"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Test, race, vet, and UI syntax
        shell: bash
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('internal/ui/index.html', 'utf8');
          for (const block of source.matchAll(/<script>([\s\S]*?)<\/script>/g)) {
            new Function(block[1]);
          }
          console.log('JavaScript syntax OK');
          NODE

  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.goos != 'linux'
        with:
          go-version: "1.22.12"
          cache: true
      - uses: actions/setup-python@v5
        if: matrix.goos != 'linux'
        with:
          python-version: "3.x"
      - name: Install Windows ARM64 CGO toolchain
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: ./scripts/setup-windows-arm64-cgo.ps1
      - name: Verify native runner
        if: matrix.goos != 'linux'
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$TARGET_GOOS"
          test "$(go env GOARCH)" = "$TARGET_GOARCH"
      - name: Build and verify release asset
        shell: bash
        env:
          GO_VERSION: "1.22.12"
          VERSION: ${{ needs.version.outputs.value }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          DIST_DIR: dist
        run: ./scripts/ci-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/plugin-gpt-allocator_${{ needs.version.outputs.value }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error

  publish:
    name: Update draft release
    needs: [version, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate aggregate checksums
        env:
          DIST_DIR: dist
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          archives = sorted(dist.glob("plugin-gpt-allocator_*.zip"))
          if not archives:
              raise SystemExit("no release archives found")
          lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in archives]
          (dist / "checksums.txt").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY
      - name: Upload assets to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: |
            dist/plugin-gpt-allocator_*.zip
            dist/checksums.txt
