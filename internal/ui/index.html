<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA Route Allocator</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #172033; }
    main { max-width: 980px; margin: 0 auto; padding: 32px 20px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0; color: #687386; }
    .card { background: #fff; border: 1px solid #e3e7ee; border-radius: 14px; padding: 20px; box-shadow: 0 8px 24px rgba(30,45,70,.05); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
    .metric strong { display: block; font-size: 28px; margin-top: 4px; }
    label { display: block; font-size: 13px; font-weight: 650; margin: 12px 0 6px; }
    input, textarea, select, button { box-sizing: border-box; width: 100%; font: inherit; border-radius: 9px; }
    input, textarea, select { border: 1px solid #cdd4df; padding: 10px 12px; background: #fff; color: #172033; }
    textarea { min-height: 190px; resize: vertical; font-family: ui-monospace, monospace; }
    button { border: 0; padding: 11px 16px; background: #315efb; color: #fff; font-weight: 700; cursor: pointer; margin-top: 12px; }
    button:disabled { opacity: .55; cursor: wait; }
    .notice { margin-top: 12px; min-height: 22px; white-space: pre-wrap; }
    .error { color: #b42318; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
    @media (prefers-color-scheme: dark) { body { background:#10131a;color:#f4f6fa } .card { background:#181d27;border-color:#2b3341 } input,textarea,select { background:#111722;color:#f4f6fa;border-color:#394356 } p {color:#9ca7b8} }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>CPA Route Allocator</h1><p>凭据导入、分组和 Mihomo 出口分配</p></div>
  </header>
  <section class="grid">
    <div class="card metric"><span>凭据</span><strong id="credentialCount">–</strong></div>
    <div class="card metric"><span>分组</span><strong id="groupCount">–</strong></div>
    <div class="card metric"><span>出口</span><strong id="slotCount">–</strong></div>
  </section>
  <section class="card">
    <h2>粘贴导入</h2>
    <p>支持单个对象、数组和 sub2api accounts 文档。预览不会写入 CPA。</p>
    <label for="managementKey">CPA Management Key</label>
    <input id="managementKey" type="password" autocomplete="current-password" placeholder="仅保存在当前页面会话">
    <label for="group">组名</label>
    <input id="group" placeholder="例如：主力账号">
    <label for="credential">凭据 JSON</label>
    <textarea id="credential" spellcheck="false" placeholder='{"accounts":[...]}'></textarea>
    <button id="preview">预览导入</button>
    <div id="notice" class="notice" role="status"></div>
  </section>
</main>
<script>
  const apiBase = '/v0/management/plugins/cpa-route-allocator';
  const keyInput = document.querySelector('#managementKey');
  const notice = document.querySelector('#notice');
  keyInput.value = sessionStorage.getItem('cpa-route-allocator-key') || '';
  keyInput.addEventListener('input', () => sessionStorage.setItem('cpa-route-allocator-key', keyInput.value));
  async function request(path, options = {}) {
    const key = keyInput.value.trim();
    const headers = { ...(options.headers || {}) };
    if (key) headers.Authorization = `Bearer ${key}`;
    const response = await fetch(apiBase + path, { ...options, headers });
    const text = await response.text();
    let body;
    try { body = JSON.parse(text); } catch { body = { message: text }; }
    if (!response.ok) throw new Error(body.error || body.message || `HTTP ${response.status}`);
    return body;
  }
  async function loadState() {
    try {
      const state = await request('/state');
      document.querySelector('#credentialCount').textContent = state.credentials?.length ?? 0;
      document.querySelector('#groupCount').textContent = state.groups?.length ?? 0;
      document.querySelector('#slotCount').textContent = state.route_slots?.length ?? 0;
    } catch (error) {
      notice.className = 'notice error';
      notice.textContent = `请输入 Management Key 后刷新状态：${error.message}`;
    }
  }
  document.querySelector('#preview').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    notice.className = 'notice';
    notice.textContent = '正在解析…';
    try {
      const credential = JSON.parse(document.querySelector('#credential').value);
      const result = await request('/import/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ group: document.querySelector('#group').value.trim(), credential })
      });
      notice.textContent = JSON.stringify(result, null, 2);
    } catch (error) {
      notice.className = 'notice error';
      notice.textContent = error.message;
    } finally { button.disabled = false; }
  });
  loadState();
</script>
</body>
</html>
